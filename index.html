<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
   <style>
    

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* Body */

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
background-image: url("download.jfif");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* Dark overlay */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    z-index: -1;
}


/* Login container */

.login-container {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* Login glass box */

.login-box {
    width: 360px;

    padding: 48px 38px;

    border: 1px solid rgba(255, 255, 255, 0.35);

    border-radius: 16px;

    background: rgba(255, 255, 255, 0.08);

    backdrop-filter: blur(5px);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25);

    color: white;
}


/* Login heading */

.login-box h2 {
    text-align: center;

    margin-bottom: 18px;

    font-size: 22px;
    font-weight: bold;
}


/* Input container */

.input-box {
    position: relative;

    width: 100%;

    margin-bottom: 22px;
}


/* Input */

.input-box input {
    width: 100%;
    height: 30px;

    padding: 0 38px 0 12px;

    border: 1px solid rgba(255, 255, 255, 0.35);

    border-radius: 20px;

    outline: none;

    background: rgba(255, 255, 255, 0.08);

    color: white;

    font-size: 13px;
}


/* Placeholder */

.input-box input::placeholder {
    color: rgba(255, 255, 255, 0.45);
}


/* Input focus */

.input-box input:focus {
    border-color: rgba(255, 255, 255, 0.8);
}


/* Icons */

.input-box i {
    position: absolute;

    right: 12px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 12px;

    color: rgb(143, 58, 58);
}


/* Remember / Forgot */

.options {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin: 4px 2px 18px;

    font-size: 12px;
}


/* Checkbox */

.options label {
    display: flex;
    align-items: center;

    gap: 4px;

    cursor: pointer;
}


/* Checkbox size */

.options input[type="checkbox"] {
    width: 8px;
    height: 8px;
}


/* Links */

.options a,
.register a {
    color: rgb(252, 250, 250);

    text-decoration: none;
}


/* Link hover */

.options a:hover,
.register a:hover {
    text-decoration: underline;
}


/* Submit button */

.submit-btn {
    width: 100%;
    height: 28px;

    border: none;

    border-radius: 20px;

    background: rgb(160, 221, 131);

    color: #222;

    font-size: 11px;

    cursor: pointer;

    transition: 0.3s;
}


/* Button hover */

.submit-btn:hover {
    background: #ab80f0;

    transform: scale(1.02);
}


/* Register text */

.register {
    text-align: center;

    margin-top: 12px;

    font-size: 9px;

    color: rgb(224, 172, 172);
}
   </style>









</head>
<body>
    <div class="login-container">

        <div class="login-box">

            <h2>Login</h2>

            <div class="input-box">
                <input type="text" placeholder="Username">
                <i class="fa-solid fa-user"></i>
            </div>

            
            <div class="input-box">
                <input type="password" placeholder="Password">
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            
            <button type="button" class="submit-btn">
                Submit
            </button>

     
            <p class="register">
                Don't have an account?
                <a href="#">Register</a>
            </p>

        </div>

    </div>


</body>
</html>
